backend:
  # ĐÃ SỬA: Bắt buộc dùng git-gateway khi kết nối với Netlify Identity
  name: git-gateway
  branch: main

locale: "vi"

media_folder: "public/images/uploads"
public_folder: "/dynamic-duo-web/images/uploads"

collections:
  - name: "stories"
    label: "📖 Quản lý Đầu truyện"
    folder: "src/data/truyen"
    create: true
    slug: "{{id}}"
    fields:
      - { label: "Mã truyện (Vd: qhbcp)", name: "id", widget: "string", hint: "Mã này viết liền không dấu, dùng để link với các chương truyện" }
      - { label: "Tên truyện", name: "title", widget: "string" }
      - { label: "Tác giả", name: "author", widget: "string" }
      - { label: "Tình trạng", name: "status", widget: "select", options: ["Đang tiến hành", "Hoàn thành", "Sắp đào"] }
      - { label: "Tổng số chương", name: "total_chapters", widget: "string", required: false }
      - { label: "Ảnh bìa", name: "cover", widget: "image", required: false }
      - { label: "Giới thiệu / Văn án", name: "description", widget: "markdown" }

  - name: "ongoing"
    label: "🐠 Cá dưới nước (Chương truyện)"
    folder: "src/pages/ca-duoi-nuoc"
    create: true
    slug: "{{truyen_id}}-chuong-{{chuong}}"
    fields:
      - { label: "Trạng thái xuất bản", name: "draft", widget: "boolean", default: false, hint: "Bật nút này nếu bạn chỉ muốn lưu nháp (tích trữ bản thảo), chưa muốn đăng lên web" }
      - { label: "Thuộc truyện nào?", name: "truyen_id", widget: "relation", collection: "stories", search_fields: ["title", "id"], value_field: "id", display_fields: ["title"], hint: "Tìm và chọn truyện (Chỉ hiện khi bạn đã tạo truyện ở mục Đầu truyện)" }
      - { label: "Số chương", name: "chuong", widget: "number", value_type: "int", hint: "Dùng để sắp xếp thứ tự trước sau" }
      - { label: "Tên chương (Vd: Chương 1 - After that)", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Mô tả ngắn (SEO)", name: "description", widget: "text", required: false, hint: "Tóm tắt ngắn gọn 1-2 dòng để hiển thị đoạn mồi khi share link chương lên FB" }
      - { label: "Thể loại (Tags)", name: "tags", widget: "list", default: ["đam mỹ", "hiện đại"] }
      - { label: "Lời Editor lảm nhảm", name: "editor_note", widget: "markdown", required: false, hint: "Lưu ý/Ghi chú của editor ở đầu hoặc cuối chương (Không nên viết chung vào nội dung)" }
      - { label: "Nội dung chương truyện", name: "body", widget: "markdown" }

  - name: "completed"
    label: "🍽️ Cá trên bàn (Chương truyện)"
    folder: "src/pages/ca-tren-ban"
    create: true
    slug: "{{truyen_id}}-chuong-{{chuong}}"
    fields:
      - { label: "Trạng thái xuất bản", name: "draft", widget: "boolean", default: false }
      - { label: "Thuộc truyện nào?", name: "truyen_id", widget: "relation", collection: "stories", search_fields: ["title", "id"], value_field: "id", display_fields: ["title"] }
      - { label: "Số chương", name: "chuong", widget: "number", value_type: "int" }
      - { label: "Tên chương", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Mô tả ngắn (SEO)", name: "description", widget: "text", required: false }
      - { label: "Thể loại (Tags)", name: "tags", widget: "list" }
      - { label: "Lời Editor lảm nhảm", name: "editor_note", widget: "markdown", required: false }
      - { label: "Nội dung chương truyện", name: "body", widget: "markdown" }

  - name: "upcoming"
    label: "🌤️ Cá trên trời (Đang đặt gạch)"
    folder: "src/pages/ca-tren-troi"
    create: true
    slug: "{{truyen_id}}-chuong-{{chuong}}"
    fields:
      - { label: "Trạng thái xuất bản", name: "draft", widget: "boolean", default: false }
      - { label: "Thuộc truyện nào?", name: "truyen_id", widget: "string", hint: "Vì phần này chỉ đặt gạch, chưa cần nối dữ liệu nên bạn tự gõ mã truyện" }
      - { label: "Số chương", name: "chuong", widget: "number", value_type: "int" }
      - { label: "Tên chương", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Thể loại (Tags)", name: "tags", widget: "list" }
      - { label: "Nội dung chương truyện", name: "body", widget: "markdown" }

  - name: "settings"
    label: "⚙️ Cài đặt Giao diện"
    files:
      - file: "src/data/settings.json"
        label: "Thông tin Website"
        name: "general"
        fields:
          - { label: "Tên Website", name: "site_name", widget: "string", default: "Dynamic Duo" }
          - { label: "Slogan (Câu chào)", name: "tagline", widget: "string", default: "paired dreams, boundless gleam ⋆.˚" }
          - { label: "Email liên hệ", name: "email", widget: "string", default: "dynamicduoo.q@gmail.com" }
          - { label: "Link WordPress cũ", name: "wp_link", widget: "string", required: false }
          - { label: "Thông báo/Lưu ý (Trang chủ)", name: "notice", widget: "markdown", required: false, hint: "Thông báo bằng chữ, có thể dùng thay thế cho ảnh thông báo để linh động sửa" }
          - { label: "Logo Website", name: "logo", widget: "image", required: false }
          - { label: "Banner Trang chủ", name: "banner", widget: "image", required: false }